[project]
name = "shakespeare-res"
version = "0.2.0"
description = "Classic vs attention-enhanced reservoirs vs Transformers for character-level language modelling"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Felix Köster"}]
dependencies = ["torch>=2.0", "numpy", "tqdm", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
